<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexicon Pro — Advanced Vocabulary Suite</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-img: url('https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?auto=format&fit=crop&w=1920&q=80');
      --card-bg: rgba(15, 23, 42, 0.88);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.3);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --secondary: rgba(30, 41, 59, 0.85);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body {
      background: linear-gradient(rgba(9, 13, 22, 0.82), rgba(9, 13, 22, 0.88)), var(--bg-img) center/cover no-repeat fixed;
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 20px 16px;
      transition: background 0.5s ease;
      -webkit-font-smoothing: antialiased;
    }

    .container { width: 100%; max-width: 580px; }
    header { text-align: center; margin-bottom: 16px; }
    .logo { font-size: 1.6rem; font-weight: 800; background: linear-gradient(135deg, #a5b4fc, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 2px; }
    p.subtitle { color: var(--muted); font-size: 0.85rem; font-weight: 500; }

    /* THEME SELECTOR */
    .theme-bar { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap; }
    .theme-btn { padding: 6px 12px; font-size: 0.75rem; border-radius: 20px; border: 1px solid var(--card-border); background: var(--card-bg); color: var(--muted); cursor: pointer; backdrop-filter: blur(8px); }
    .theme-btn.active { border-color: var(--accent); color: #fff; background: var(--accent); }

    .stats-bar { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); backdrop-filter: blur(12px); padding: 12px 18px; border-radius: 14px; margin-bottom: 16px; font-size: 0.88rem; border: 1px solid var(--card-border); box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
    .streak { color: var(--warning); font-weight: 600; display: flex; align-items: center; gap: 6px; }

    .nav-tabs { display: flex; gap: 4px; margin-bottom: 16px; background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(10px); padding: 4px; border-radius: 12px; border: 1px solid var(--card-border); overflow-x: auto; }
    .tab-btn { flex: 1; padding: 10px 6px; border: none; background: transparent; color: var(--muted); font-size: 0.82rem; font-weight: 600; cursor: pointer; border-radius: 8px; white-space: nowrap; text-align: center; transition: all 0.2s ease; }
    .tab-btn.active { background: var(--accent); color: white; box-shadow: 0 2px 8px var(--accent-glow); }

    .card { background: var(--card-bg); backdrop-filter: blur(14px); padding: 20px; border-radius: 16px; border: 1px solid var(--card-border); box-shadow: 0 8px 24px rgba(0,0,0,0.4); margin-bottom: 16px; }
    
    input { width: 100%; padding: 12px 14px; border: 1px solid var(--card-border); background: rgba(11, 17, 30, 0.85); color: white; border-radius: 10px; font-size: 0.95rem; }
    input:focus { outline: none; border-color: var(--accent); }

    .btn { width: 100%; padding: 13px; border: none; background: var(--accent); color: white; font-size: 0.95rem; font-weight: 600; border-radius: 10px; cursor: pointer; transition: all 0.2s ease; }
    .btn:active { transform: scale(0.98); }
    .btn-secondary { background: var(--secondary); margin-top: 10px; font-size: 0.88rem; border: 1px solid var(--card-border); color: var(--muted); }
    .btn-secondary:hover { color: white; background: rgba(38, 51, 77, 0.9); }

    /* WORD LIST & EXAMPLES (BOSH MENYU) */
    .word-item { padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .word-item:last-child { border-bottom: none; }
    .word-term { font-weight: 700; font-size: 1.05rem; color: #f1f5f9; }
    .word-def { color: var(--muted); font-size: 0.88rem; margin-top: 3px; line-height: 1.3; }
    .word-example { font-style: italic; font-size: 0.82rem; color: #a5b4fc; margin-top: 5px; line-height: 1.3; }

    /* ORIGINAL FLASHCARD COMPONENT */
    .quiz-card { text-align: center; min-height: 220px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; border: 2px dashed var(--card-border); user-select: none; transition: transform 0.2s ease, border-color 0.2s; position: relative; background: rgba(14, 22, 38, 0.85); touch-action: pan-y; }
    .quiz-card:hover { border-color: var(--accent); }
    .prompt-label { font-size: 0.75rem; color: #818cf8; text-transform: uppercase; font-weight: 700; margin-bottom: 12px; letter-spacing: 1px; }
    .quiz-term { font-size: 1.6rem; font-weight: 800; margin-bottom: 8px; word-break: break-word; color: #fff; }
    .quiz-def { font-size: 1.05rem; color: var(--muted); display: none; margin-top: 12px; line-height: 1.4; animation: fadeIn 0.3s forwards; }

    .quiz-actions { display: flex; gap: 10px; margin-top: 18px; }
    .btn-correct { background: #059669; }
    .btn-wrong { background: #dc2626; }

    /* MATCHING GAME */
    .match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .match-card { background: rgba(11, 17, 30, 0.85); border: 1px solid var(--card-border); padding: 12px; border-radius: 10px; text-align: center; cursor: pointer; font-size: 0.88rem; min-height: 50px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .match-card.selected { border-color: var(--accent); background: rgba(99, 102, 241, 0.25); }
    .match-card.matched { opacity: 0; pointer-events: none; transition: opacity 0.3s; }

    /* MULTIPLE CHOICE & SPELLING */
    .mc-options { display: grid; gap: 10px; margin-top: 16px; }
    .mc-btn { background: rgba(11, 17, 30, 0.85); border: 1px solid var(--card-border); color: #e2e8f0; padding: 14px; border-radius: 10px; font-size: 0.92rem; cursor: pointer; text-align: left; transition: all 0.2s; line-height: 1.3; }
    .mc-btn:hover { border-color: var(--accent); }
    .mc-btn.correct-choice { background: #064e3b !important; border-color: var(--success) !important; color: #a7f3d0; }
    .mc-btn.wrong-choice { background: #7f1d1d !important; border-color: var(--danger) !important; color: #feccae; }

    .type-feedback { font-weight: 700; margin-top: 14px; text-align: center; font-size: 0.95rem; }

    .hidden { display: none !important; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo">Lexicon Pro</div>
    <p class="subtitle">Vocabulary & Memory Suite</p>
  </header>

  <!-- THEME SWITCHER -->
  <div class="theme-bar">
    <button class="theme-btn active" onclick="setTheme('london', this)">🇬🇧 London</button>
    <button class="theme-btn" onclick="setTheme('oxford', this)">📚 Oxford</button>
    <button class="theme-btn" onclick="setTheme('ny', this)">🇺🇸 New York</button>
    <button class="theme-btn" onclick="setTheme('cyber', this)">🌌 Cyberpunk</button>
  </div>

  <div class="stats-bar">
    <span class="streak">🔥 <span id="streakCount">0</span> Day Streak</span>
    <span style="color: var(--muted);">Reviewed Today: <b id="todayCount" style="color: var(--text);">0</b></span>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('manage')">Vocabulary</button>
    <button class="tab-btn" onclick="switchTab('match')">Match</button>
    <button class="tab-btn" onclick="switchTab('cards')">Flashcards</button>
    <button class="tab-btn" onclick="switchTab('mc')">Quiz</button>
    <button class="tab-btn" onclick="switchTab('type')">Spelling</button>
  </div>

  <!-- VOCABULARY TAB (GAPLAR SHU YERDA QOLDI) -->
  <div id="manageTab">
    <div class="card">
      <input type="text" id="searchInput" placeholder="🔍 Search vocabulary..." oninput="renderWordList()">
    </div>
    <div class="card">
      <h3 style="margin-bottom: 12px; font-size: 0.95rem; color: var(--muted); font-weight: 600;">Saved Terms (<span id="wordCount">0</span>)</h3>
      <div id="wordList"></div>
    </div>
  </div>

  <!-- MATCHING GAME TAB -->
  <div id="matchTab" class="hidden">
    <div class="card">
      <span class="prompt-label">Match words with their meanings:</span>
      <div class="match-grid" id="matchGrid" style="margin-top:12px;"></div>
      <button class="btn btn-secondary hidden" id="matchResetBtn" style="margin-top:14px;" onclick="startMatchGame()">Play Again 🔄</button>
    </div>
  </div>

  <!-- ORIGINAL FLASHCARDS TAB -->
  <div id="cardsTab" class="hidden">
    <div class="card">
      <div class="card quiz-card" id="flashcardEl" onclick="toggleAnswer()">
        <span class="prompt-label" id="cardState">Tap to reveal answer</span>
        <div class="quiz-term" id="cardTerm">...</div>
        <div class="quiz-def" id="cardDef">...</div>
      </div>
      <div class="quiz-actions hidden" id="cardControls">
        <button class="btn btn-wrong" onclick="nextCard(false)">Needs Work ❌</button>
        <button class="btn btn-correct" onclick="nextCard(true)">Mastered ✅</button>
      </div>
    </div>
  </div>

  <!-- MULTIPLE CHOICE TAB -->
  <div id="mcTab" class="hidden">
    <div class="card">
      <span class="prompt-label">Select correct definition:</span>
      <div class="quiz-term" id="mcTerm" style="margin-top:10px;">...</div>
      <div class="mc-options" id="mcOptions"></div>
      <button class="btn btn-secondary hidden" id="mcNextBtn" style="margin-top:16px;" onclick="startMCQuiz()">Next Word ➔</button>
    </div>
  </div>

  <!-- SPELLING TAB -->
  <div id="typeTab" class="hidden">
    <div class="card">
      <span class="prompt-label">Type corresponding word:</span>
      <div class="word-def" id="typeDef" style="font-size:1.1rem; color:#fff; margin: 14px 0 18px 0; font-weight: 500;">...</div>
      <input type="text" id="typeInput" placeholder="Type answer..." autocomplete="off">
      <button class="btn" style="margin-top:12px;" onclick="checkTypeAnswer()">Verify Answer</button>
      <div class="type-feedback" id="typeFeedback"></div>
      <button class="btn btn-secondary hidden" id="typeNextBtn" style="margin-top:16px;" onclick="startTypeQuiz()">Next Word ➔</button>
    </div>
  </div>

</div>

<script>
  const words = [
    {"id":1,"term":"Glossary","meaning":"so'zlar ruyhati","ex":"Consult the glossary at the back of the book."},
    {"id":2,"term":"Foreign","meaning":"chet el","ex":"Learning a foreign language opens new doors."},
    {"id":3,"term":"Foreigner","meaning":"chet ellik","ex":"The locals welcomed the foreigner warmly."},
    {"id":4,"term":"Gist","meaning":"umumiy mano","ex":"I caught the main gist of his lecture."},
    {"id":5,"term":"Recognize sb/sth","meaning":"tanimoq","ex":"I failed to recognize him in the crowd."},
    {"id":6,"term":"Identify","meaning":"aniqlamoq","ex":"Scientists can identify patterns in data."},
    {"id":7,"term":"Identification","meaning":"tasdiq","ex":"You need official identification to enter."},
    {"id":8,"term":"Go through sth","meaning":"sinchiklab o'qish, boshdan kechirmoq","ex":"Let's go through the report once more."},
    {"id":9,"term":"Suppose, guess, predict","meaning":"taxmin qilmoq","ex":"I suppose we will arrive on schedule."},
    {"id":10,"term":"Keep a record","meaning":"yozib olmoq","ex":"It is wise to keep a record of your expenses."},
    {"id":11,"term":"Record","meaning":"videoga olish, rekord","ex":"He broke the world record yesterday."},
    {"id":12,"term":"Make a note of sth","meaning":"yozib olmoq","ex":"Make a note of these crucial terms."},
    {"id":13,"term":"Construction","meaning":"gap tuzilishi","ex":"Sentence construction requires practice."},
    {"id":14,"term":"Tip","meaning":"maslahat , choy chaqa","ex":"Here is a tip for better IELTS writing."},
    {"id":15,"term":"Repetition","meaning":"qaytarish","ex":"Vocabulary learning requires repetition."},
    {"id":16,"term":"Explain","meaning":"tushuntirmoq","ex":"Can you explain this rule again?"},
    {"id":17,"term":"Pronounce","meaning":"talaffuz qilmoq","ex":"Practice to pronounce difficult words clearly."},
    {"id":18,"term":"Opportunity","meaning":"imkoniyat","ex":"Grasp every opportunity to speak English."},
    {"id":19,"term":"Revise","meaning":"takrorlash","ex":"Revise your notes before the test."},
    {"id":20,"term":"Method","meaning":"usul","ex":"Choose an effective study method."},
    {"id":21,"term":"Quite","meaning":"ozgina","ex":"The exam was quite challenging."},
    {"id":22,"term":"Aim, goal, purpose","meaning":"maqsad","ex":"My ultimate aim is an 8.0 writing score."},
    {"id":23,"term":"Enthusiastic","meaning":"qiziqqan","ex":"She is enthusiastic about learning new skills."},
    {"id":24,"term":"Motivated","meaning":"ruhlangan","ex":"Highly motivated students progress faster."},
    {"id":25,"term":"Encourage, motivate","meaning":"dalda bermoq","ex":"Teachers should encourage active debate."},
    {"id":26,"term":"Improve, get better, make progress","meaning":"o’stirish , yaxshilash","ex":"Constant effort helps improve fluency."},
    {"id":27,"term":"Express","meaning":"ifodalab bermoq","ex":"It is vital to express ideas logically."},
    {"id":28,"term":"Effectively","meaning":"samarali","ex":"Communicate your thoughts effectively."},
    {"id":29,"term":"Obvious, clear","meaning":"tiniq ,aniq","ex":"The answer was obvious to everyone."},
    {"id":30,"term":"Encouraging","meaning":"ruhlantiradigan","ex":"The test results were very encouraging."},
    {"id":31,"term":"Accurately","meaning":"bexato","ex":"Answer all questions accurately."},
    {"id":32,"term":"Be aware of sth","meaning":"xabardor bo'lmoq","ex":"Be aware of common grammar mistakes."},
    {"id":33,"term":"Frustrating","meaning":"xafsalani pir qiladigan","ex":"Slow progress can be frustrating."},
    {"id":34,"term":"Awareness","meaning":"ogohlik","ex":"Raise public awareness about education."},
    {"id":35,"term":"Expand","meaning":"kengaytirmoq","ex":"Reading extensively will expand your vocabulary."},
    {"id":36,"term":"A wide range of sth","meaning":"turli xil","ex":"Use a wide range of vocabulary."},
    {"id":37,"term":"Complex","meaning":"qiyin , murakkab","ex":"Avoid overly complex sentence structures."},
    {"id":38,"term":"Fluent","meaning":"ravon","ex":"She became fluent after studying abroad."},
    {"id":39,"term":"In detail","meaning":"to’liq","ex":"Explain your arguments in detail."},
    {"id":40,"term":"Appropriate","meaning":"mos muvofiq","ex":"Select language appropriate for academic essays."},
    {"id":41,"term":"Relevant to sth","meaning":"nimadir bilan bog’liq","ex":"Include only details relevant to the topic."},
    {"id":42,"term":"Specialized","meaning":"ixtisoslashtirilgan","ex":"He studies specialized medical terminology."},
    {"id":43,"term":"Violence","meaning":"zo’ravonlik","ex":"Media should avoid displaying violence."},
    {"id":44,"term":"For instance","meaning":"misol uchun","ex":"For instance, urbanization causes traffic jams."},
    {"id":45,"term":"Slang","meaning":"ko’cha tili","ex":"Avoid slang in formal academic writing."},
    {"id":46,"term":"Offensive","meaning":"haqorat","ex":"His comments were deemed offensive."},
    {"id":47,"term":"Offend sb","meaning":"haqoratlamoq","ex":"Be careful not to offend anyone."},
    {"id":48,"term":"Syllable","meaning":"bo’g’in","ex":"The word 'understand' has three syllables."},
    {"id":49,"term":"Select, choose","meaning":"tanlamoq","ex":"Select the correct option from below."},
    {"id":50,"term":"Selection, choice","meaning":"tanlov","ex":"A wide selection of books is available."},
    {"id":51,"term":"Stress","meaning":"urg’u bermoq","ex":"Stress the second syllable of the word."},
    {"id":52,"term":"Emphasize","meaning":"urg’u bermoq","ex":"Emphasize key points in your conclusion."}
  ];

  let wordWeights = JSON.parse(localStorage.getItem('lexicon_weights')) || {};
  words.forEach(w => { if(!wordWeights[w.id]) wordWeights[w.id] = 3; });

  let stats = JSON.parse(localStorage.getItem('lexicon_stats')) || { streak: 0, lastDate: '', todayCount: 0 };
  let currentWord = null;

  function playSound(type) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      if(type === 'correct') {
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        osc.start(); osc.stop(ctx.currentTime + 0.25);
      } else {
        osc.frequency.setValueAtTime(200, ctx.currentTime);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        osc.start(); osc.stop(ctx.currentTime + 0.2);
      }
    } catch(e) {}
  }

  function triggerConfetti() {
    try { confetti({ particleCount: 40, spread: 60, origin: { y: 0.8 } }); } catch(e){}
  }

  const themes = {
    london: "url('https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?auto=format&fit=crop&w=1920&q=80')",
    oxford: "url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&w=1920&q=80')",
    ny: "url('https://images.unsplash.com/photo-1538688525198-9b88f6f53126?auto=format&fit=crop&w=1920&q=80')",
    cyber: "url('https://images.unsplash.com/photo-1508739773434-c26b3d09e071?auto=format&fit=crop&w=1920&q=80')"
  };

  function setTheme(t, btn) {
    document.body.style.setProperty('--bg-img', themes[t]);
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  function getWeightedWord() {
    let pool = [];
    words.forEach(w => {
      let weight = wordWeights[w.id] || 3;
      for(let i=0; i<weight; i++) pool.push(w);
    });
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function adjustWeight(id, success) {
    if(!wordWeights[id]) wordWeights[id] = 3;
    if(success) wordWeights[id] = Math.max(1, wordWeights[id] - 1);
    else wordWeights[id] = Math.min(8, wordWeights[id] + 2);
    localStorage.setItem('lexicon_weights', JSON.stringify(wordWeights));
  }

  function checkStreak() {
    const today = new Date().toISOString().split('T')[0];
    if (stats.lastDate !== today) {
      const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
      if (stats.lastDate !== yesterday.toISOString().split('T')[0] && stats.lastDate !== '') stats.streak = 0;
      stats.todayCount = 0;
    }
    document.getElementById('streakCount').textContent = stats.streak;
    document.getElementById('todayCount').textContent = stats.todayCount;
  }

  function incrementReview() {
    const today = new Date().toISOString().split('T')[0];
    if (stats.lastDate !== today) { stats.streak += 1; stats.lastDate = today; }
    stats.todayCount += 1;
    localStorage.setItem('lexicon_stats', JSON.stringify(stats));
    checkStreak();
  }

  function renderWordList() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const listEl = document.getElementById('wordList');
    const filtered = words.filter(w => w.term.toLowerCase().includes(query) || w.meaning.toLowerCase().includes(query));
    document.getElementById('wordCount').textContent = words.length;

    listEl.innerHTML = filtered.map(w => `
      <div class="word-item">
        <div class="word-term">${w.term}</div>
        <div class="word-def">${w.meaning}</div>
        <div class="word-example">"${w.ex}"</div>
      </div>
    `).join('');
  }

  /* MATCHING GAME */
  let matchSelected = null;
  let matchesLeft = 0;
  function startMatchGame() {
    document.getElementById('matchResetBtn').classList.add('hidden');
    let pool = [...words].sort(() => 0.5 - Math.random()).slice(0, 4);
    matchesLeft = pool.length;
    let cards = [];
    pool.forEach(w => {
      cards.push({ id: w.id, text: w.term });
      cards.push({ id: w.id, text: w.meaning });
    });
    cards.sort(() => 0.5 - Math.random());
    
    document.getElementById('matchGrid').innerHTML = cards.map((c, i) => `
      <div class="match-card" data-id="${c.id}" onclick="handleMatchClick(this)">${c.text}</div>
    `).join('');
  }

  function handleMatchClick(el) {
    if(el.classList.contains('matched') || el === matchSelected) return;
    if(!matchSelected) {
      matchSelected = el;
      el.classList.add('selected');
    } else {
      if(matchSelected.dataset.id === el.dataset.id) {
        playSound('correct');
        matchSelected.classList.add('matched');
        el.classList.add('matched');
        matchesLeft--;
        if(matchesLeft === 0) {
          triggerConfetti();
          document.getElementById('matchResetBtn').classList.remove('hidden');
          incrementReview();
        }
      } else {
        playSound('wrong');
        matchSelected.classList.remove('selected');
      }
      matchSelected = null;
    }
  }

  /* ORIGINAL FLASHCARDS LOGIC */
  function startCards() {
    currentWord = getWeightedWord();
    document.getElementById('cardState').textContent = 'Tap to reveal answer';
    document.getElementById('cardTerm').textContent = currentWord.term;
    document.getElementById('cardDef').textContent = currentWord.meaning;
    document.getElementById('cardDef').style.display = 'none';
    document.getElementById('cardControls').classList.add('hidden');
  }

  function toggleAnswer() {
    const defEl = document.getElementById('cardDef');
    const isHidden = defEl.style.display === 'none';
    defEl.style.display = isHidden ? 'block' : 'none';
    document.getElementById('cardState').textContent = isHidden ? 'Definition:' : 'Tap to reveal answer';
    document.getElementById('cardControls').classList.toggle('hidden', !isHidden);
  }

  function nextCard(success) {
    adjustWeight(currentWord.id, success);
    if(success) { playSound('correct'); incrementReview(); } else playSound('wrong');
    startCards();
  }

  /* MULTIPLE CHOICE */
  function startMCQuiz() {
    document.getElementById('mcNextBtn').classList.add('hidden');
    currentWord = getWeightedWord();
    document.getElementById('mcTerm').textContent = currentWord.term;

    let choices = [currentWord, ...words.filter(w => w.id !== currentWord.id).sort(() => 0.5 - Math.random()).slice(0, 3)].sort(() => 0.5 - Math.random());
    document.getElementById('mcOptions').innerHTML = choices.map(c => `
      <button class="mc-btn" onclick="checkMC(this, ${c.id === currentWord.id})">${c.meaning}</button>
    `).join('');
  }

  function checkMC(btn, isCorrect) {
    document.querySelectorAll('.mc-btn').forEach(b => b.disabled = true);
    adjustWeight(currentWord.id, isCorrect);
    if(isCorrect) { btn.classList.add('correct-choice'); playSound('correct'); triggerConfetti(); incrementReview(); }
    else { btn.classList.add('wrong-choice'); playSound('wrong'); }
    document.getElementById('mcNextBtn').classList.remove('hidden');
  }

  /* SPELLING */
  function startTypeQuiz() {
    document.getElementById('typeNextBtn').classList.add('hidden');
    document.getElementById('typeFeedback').textContent = '';
    document.getElementById('typeInput').value = '';
    document.getElementById('typeInput').disabled = false;
    currentWord = getWeightedWord();
    document.getElementById('typeDef').textContent = currentWord.meaning;
  }

  function checkTypeAnswer() {
    const input = document.getElementById('typeInput').value.trim().toLowerCase();
    const cleanTarget = currentWord.term.replace(/\s*\([^)]*\)/g, "").trim().toLowerCase();
    const fb = document.getElementById('typeFeedback');

    if(input === cleanTarget) {
      fb.textContent = "Correct! ✨"; fb.style.color = "var(--success)";
      playSound('correct'); triggerConfetti(); adjustWeight(currentWord.id, true); incrementReview();
    } else {
      fb.textContent = `Incorrect. Target: "${cleanTarget}"`; fb.style.color = "var(--danger)";
      playSound('wrong'); adjustWeight(currentWord.id, false);
    }
    document.getElementById('typeInput').disabled = true;
    document.getElementById('typeNextBtn').classList.remove('hidden');
  }

  function switchTab(tab) {
    ['manageTab', 'matchTab', 'cardsTab', 'mcTab', 'typeTab'].forEach(t => document.getElementById(t).classList.add('hidden'));
    const btns = document.querySelectorAll('.tab-btn');
    btns.forEach(b => b.classList.remove('active'));

    if(tab === 'manage') { document.getElementById('manageTab').classList.remove('hidden'); btns[0].classList.add('active'); }
    else if(tab === 'match') { document.getElementById('matchTab').classList.remove('hidden'); btns[1].classList.add('active'); startMatchGame(); }
    else if(tab === 'cards') { document.getElementById('cardsTab').classList.remove('hidden'); btns[2].classList.add('active'); startCards(); }
    else if(tab === 'mc') { document.getElementById('mcTab').classList.remove('hidden'); btns[3].classList.add('active'); startMCQuiz(); }
    else if(tab === 'type') { document.getElementById('typeTab').classList.remove('hidden'); btns[4].classList.add('active'); startTypeQuiz(); }
  }

  checkStreak();
  renderWordList();
</script>
</body>
</html>
